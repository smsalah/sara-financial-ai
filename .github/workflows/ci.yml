name: CI/CD Pipeline - Sara Financial AI

on:
  push:
    branches: [ main, feature/milestone-4-cicd-recovery ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov black flake8 httpx

    - name: Run Code Formatting Check (Black)
      run: |
        black --check src/ tests/

    - name: Run Style Linting (Flake8)
      run: |
        # Stop build if there are Python syntax errors or undefined names
        flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings for initial hardening
        flake8 src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run Pytest Test Suite with Coverage
      env:
        PYTHONPATH: .
      run: |
        pytest --cov=src --cov-report=xml --cov-report=term-missing -v